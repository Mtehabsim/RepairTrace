name: CPU checks
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/workflow_check.py --output /tmp/repairtrace-checks
      # Namespace demos require a compatible host and are tested separately.
