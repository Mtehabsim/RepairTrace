[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairtrace"
version = "0.1.0"
description = "Source-bound verification evidence for local coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
repairtrace = "repairtrace.__main__:main"

[tool.setuptools]
packages = ["repairtrace", "workbench"]

[tool.setuptools.package-data]
workbench = ["sandbox_exec.sh"]
